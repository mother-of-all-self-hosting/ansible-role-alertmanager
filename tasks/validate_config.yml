---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "alertmanager_process_default_arguments", "new": "alertmanager_process_extra_arguments_default" }
    - { "old": "alertmanager_process_arguments", "new": "alertmanager_process_extra_arguments" }
    - { "old": "alertmanager_http_header_content_permission_policy", "new": "alertmanager_http_header_permissions_policy" }
    - { "old": "alertmanager_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }
    - { "old": "alertmanager_basic_auth_apache_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Alertmanager settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - alertmanager_identifier
    - alertmanager_uid
    - alertmanager_gid
    - alertmanager_container_network
